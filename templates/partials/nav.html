<header>
    <div class="main">
        <a href={{ config.base_url }}>{{ config.title }}</a>

        <div class="socials">
            {% for social in config.extra.socials %}
                <!-- EXT: rel="me" to verify Mastodon links --->
	        <a {% if social.name == "mastodon" %}rel="me"{% endif %} href="{{ social.url }}" class="social">
	            <img alt={{ social.name }} src="/social_icons/{{ social.icon }}.svg">
	        </a>
            {% endfor %}
        </div>
    </div>

    <nav>
        {% for menu in config.extra.menu %}
            <a href={{ menu.url }} style="margin-left: 0.7em">{{ menu.name }}</a>
        {% endfor %}

        {% if config.extra.theme == "toggle" %}
        | <a id="dark-mode-toggle" onclick="toggleTheme()" href="javascript:void(0)">
            {# EXT: add title attributes to theme switch icons to show tooltips #}
            <img src="/feather/sun.svg" id="sun-icon" style="filter: invert(1);" title="Switch to light theme"/>
            <img src="/feather/moon.svg" id="moon-icon" title="Switch to dark theme"/>
        </a>
        <script src={{ get_url(path="js/themetoggle.js" ) }}></script>
        {% endif %}
    </nav>
</header>
